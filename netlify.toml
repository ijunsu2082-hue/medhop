[build]
  # The hosted site can never reach a MedHop backend, so it runs the simulator in the page (vite.config.ts refuses
  # any other build on Netlify).
  base = "frontend"
  command = "npm run build:browser"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
